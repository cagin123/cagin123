
<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="230" rx="12" fill="#0D1117"/>

  <g fill="#F97316" opacity="0.8">
    <circle cx="30" cy="30" r="2"/>
    <circle cx="870" cy="195" r="2"/>
    <circle cx="820" cy="35" r="2"/>
    <circle cx="65" cy="190" r="2"/>
  </g>

  <text x="35" y="35" fill="#F97316" font-family="monospace" font-size="12">
    MATHEMATICAL EXPLORATIONS
  </text>

  <g font-family="serif" font-size="25" fill="#E6EDF3">
    <text x="65" y="95">
      a² + b² = c²
      <animate attributeName="opacity" values="0.25;1;0.25" dur="5s" repeatCount="indefinite"/>
    </text>

    <text x="340" y="95">
      ∑ k = n(n+1)/2
      <animate attributeName="opacity" values="1;0.25;1" dur="5s" repeatCount="indefinite"/>
    </text>

    <text x="675" y="95">
      π = 3.14159...
      <animate attributeName="opacity" values="0.25;1;0.25" dur="5s" repeatCount="indefinite"/>
    </text>

    <text x="100" y="155">
      gcd(a,b) = 1
      <animate attributeName="opacity" values="1;0.25;1" dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="390" y="155">
      e^(iπ) + 1 = 0
      <animate attributeName="opacity" values="0.25;1;0.25" dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="700" y="155">
      ∞
      <animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <path d="M35 185 H865" stroke="#30363D" stroke-width="1"/>

  <text x="35" y="210" fill="#8B949E" font-family="monospace" font-size="11">
    NUMBER THEORY · ALGEBRA · MATHEMATICS
  </text>

  <circle cx="850" cy="205" r="4" fill="#F97316">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
